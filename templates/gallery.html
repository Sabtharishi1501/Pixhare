{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
  <h2 class="mb-4">{{ guest.name }}'s Photo Gallery</h2>

  {% if photos %}
    <div class="row justify-content-center">
      {% for photo in photos %}
        <div class="col-md-4 col-sm-6 mb-4">
          <img src="{{ photo }}" class="img-fluid rounded shadow-sm" alt="Event Photo">
        </div>
      {% endfor %}
    </div>
  {% else %}
    <div class="alert alert-warning mt-4">
      No matched photos yet.
    </div>
  {% endif %}
</div>
{% endblock %}
