{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">

  <!-- 🔙 Back Button -->
  <a href="{{ url_for('view_event_photos', event_name=event_name) }}" class="btn btn-outline-secondary mb-3">
    ← Back to Event Photos
  </a>

  <!-- 📸 Photo Display -->
  <div class="text-center">
    <img src="{{ url_for('static', filename='photos/' + event_name + '/' + photo_filename) }}" class="img-fluid rounded shadow" alt="Event Photo">
  </div>

</div>
{% endblock %}
